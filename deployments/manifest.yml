---
# Namespace for the application
apiVersion: v1
kind: Namespace
metadata:
  name: browser-sandbox
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: browser-sandbox
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: "sandbox_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: browser-sandbox
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: browser-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: browser-sandbox
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# Guacamole Server Deployment (guacd)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: browser-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd:latest
          ports:
            - containerPort: 4822
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# Guacamole Server Service
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: browser-sandbox
spec:
  ports:
    - port: 4822
      targetPort: 4822
  type: ClusterIP
  selector:
    app: guacd
---
# MinIO Deployment for S3 Storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: browser-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            - name: MINIO_BUCKET
              value: "browser-sandbox"
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
# MinIO PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: browser-sandbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# MinIO Service
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: browser-sandbox
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: minio
---
# Backend API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-sandbox-api
  namespace: browser-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browser-sandbox-api
  template:
    metadata:
      labels:
        app: browser-sandbox-api
    spec:
      serviceAccountName: browser-sandbox-sa
      containers:
        - name: api
          image: ghcr.io/browsersec/kubebrowse:encore-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: GUACD_ADDRESS
              value: "guacd.browser-sandbox.svc.cluster.local:4822"
            - name: DATABASE_URL
              value: "postgres://postgresuser:postgrespassword@postgres.browser-sandbox.svc.cluster.local:5432/sandbox_db?sslmode=disable"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: "sandbox_db"
            - name: REDIS_HOST
              value: "redis.browser-sandbox.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            - name: MINIO_BUCKET
              value: "browser-sandbox"
            - name: CLAMAV_ADDRESS
              value: "http://clamd-api.browser-sandbox.svc.cluster.local:3000"
            - name: KUBERNETES_NAMESPACE
              value: "browser-sandbox"
            - name: POD_SESSION_TIMEOUT
              value: "10" # 10 minutes
            - name: POD_SESSION_TTL
              value: "6" # 6 minutes
            - name: JAEGER_ENDPOINT
              value: "http://152.53.244.80:14268/api/traces"
            - name: JAEGER_SERVICE_NAME
              value: "browser-sandbox"
            - name: DISTRIBUTED_TRACING
              value: "true"
            - name: GITHUB_CLIENT_ID
              value: "Ov23li974J8UoG1CH0HJ"
            - name: GITHUB_CLIENT_SECRET
              value: "f16b7dc2b85d4a7f817e273b4a2d64124153ce8f"
            - name: GITHUB_CALLBACK_URL
                value: "https://localhost:8080/auth/oauth/github/callback"
            - name: SESSION_SECRET
              value: "McX0xoYlJYpO0EGdUZC6aJxVh2rKYrXZM7SPMpVREeXMXoMBI20v90PICD-LfEn7jr07c5vH2CWcKzjl8hoNvQ"
            - name: FRONTEND_URL
              value: "http://localhost:8080,http://localhost:3000,http://localhost:5173"
            - name: ENVIRONMENT
              value: "development"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
