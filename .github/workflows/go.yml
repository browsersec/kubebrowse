name: Go

on:
  push:
    branches: [ main , "chore/improve-back" , "chore/without-oauth" ]
    tags:
      - 'v*'
    paths-ignore:
      - 'cmd/cleanup/**'
      - 'deployments/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'cmd/cleanup/**'
      - 'deployments/**'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENCORE_AUTH_TOKEN: ${{ secrets.ENCORE_AUTH_TOKEN }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v2
      with:
        go-version: '^1.24'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v3

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Test Go packages
      run: go test ./...

    - name: Install Encore
      if: env.ENCORE_AUTH_TOKEN != ''
      run: curl -L https://encore.dev/install.sh | bash

    - name: Test Encore application
      if: env.ENCORE_AUTH_TOKEN != ''
      run: $HOME/.encore/bin/encore test ./...
