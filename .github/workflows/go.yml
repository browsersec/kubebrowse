name: Go

on:
  push:
    branches: [ main , "chore/improve-back" , "chore/without-oauth" ]
    tags:
      - 'v*'
    paths-ignore:
      - 'cmd/cleanup/**'
      - 'deployments/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'cmd/cleanup/**'
      - 'deployments/**'
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: '^1.25'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Get dependencies
      run: go mod download

    - name: Install Encore
      run: curl --fail --location --proto '=https' --tlsv1.2 https://encore.dev/install.sh | bash

    - name: Generate Encore wrappers
      run: $HOME/.encore/bin/encore gen wrappers

    - name: Test Go packages
      run: go test ./...

    - name: Detect Encore credentials
      id: encore-auth
      env:
        ENCORE_AUTH_TOKEN: ${{ secrets.ENCORE_AUTH_TOKEN }}
      run: |
        if [ -n "$ENCORE_AUTH_TOKEN" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Test Encore application
      if: steps.encore-auth.outputs.available == 'true'
      env:
        ENCORE_AUTH_TOKEN: ${{ secrets.ENCORE_AUTH_TOKEN }}
      run: $HOME/.encore/bin/encore test ./...
